<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tiger — Art Comes Alive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}

#loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000}
#loading.hidden{display:none}
.title{font-family:Georgia,serif;font-size:1.5rem;color:#f0c040;letter-spacing:.08em}
.hint{font-size:.85rem;color:rgba(255,255,255,.4);max-width:300px;text-align:center;line-height:1.5}
.spinner{width:36px;height:36px;border:2px solid rgba(240,192,64,.15);border-top-color:#f0c040;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#start-btn{padding:16px 40px;background:#f0c040;color:#0a0a0a;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;letter-spacing:.04em;box-shadow:0 4px 20px rgba(240,192,64,.3)}
#start-btn:active{transform:scale(.95)}

#bottom-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:16px}
#bottom-bar.hidden{display:none}
.ctrl{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:1.15rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,transform .15s}
.ctrl:hover{background:rgba(255,255,255,.18)}.ctrl:active{transform:scale(.92)}

#status{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;padding:6px 14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:16px;font-size:.7rem;color:rgba(255,255,255,.5);text-align:center;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
#status.hidden{display:none}

#debug{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:101;padding:4px 12px;background:rgba(0,0,0,.7);border-radius:12px;font-size:.65rem;color:#f0c040;font-family:monospace;pointer-events:none;white-space:nowrap}
#debug.hidden{display:none}

#error{position:fixed;inset:0;z-index:300;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center}
#error.visible{display:flex}
#error h2{color:#f87171;font-size:1.15rem}
#error p{color:rgba(255,255,255,.45);font-size:.85rem;line-height:1.6;max-width:340px}
#error .btn{padding:10px 28px;background:#f0c040;color:#0a0a0a;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;margin-top:2px}
</style>
</head>
<body>

<!-- Loading screen with tap-to-start -->
<div id="loading">
  <div class="title">Art Comes Alive</div>
  <div class="hint" id="loading-hint">Point your camera at the artwork<br>to see the tiger come alive</div>
  <button id="start-btn">&#128247;&nbsp; Start Camera</button>
  <div class="spinner" id="spinner" style="display:none"></div>
</div>

<!-- Status -->
<div id="status" class="hidden"></div>
<div id="debug" class="hidden"></div>

<!-- Bottom controls -->
<div id="bottom-bar" class="hidden">
<button class="ctrl" id="btn-pause" title="Play/Pause">&#9654;</button>
<button class="ctrl" id="btn-fs" title="Fullscreen">&#10066;</button>
</div>

<!-- Error -->
<div id="error">
<h2 id="err-title">AR Not Available</h2>
<p id="err-text">Your browser doesn't support AR.</p>
<a class="btn" id="btn-watch" href="#">Watch Video</a>
</div>

<!-- AR.js scene (no sourceType — camera starts via getUserMedia on tap) -->
<a-scene id="ar-scene"
  embedded
  vr-mode-ui="enabled: false"
  arjs="debugUIEnabled: false;
        width: 1280; height: 960;
        backgroundImage: none;"
  renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true">

  <!-- Camera -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Hiro marker with video overlay -->
  <a-entity hiro-marker="">
    <a-video
      id="overlay-video"
      src="assets/video.mp4"
      position="0 0 -2"
      width="1.6"
      height="2.26"
      loop
      autoplay
      mute
      opacity="1">
    </a-video>
  </a-entity>

</a-scene>

<!-- Three.js (with CDN fallback) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"
  onerror="this.onerror=null;this.src='https://unpkg.com/three@0.150.0/build/three.min.js'"></script>
<!-- A-Frame (with CDN fallback) -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"
  onerror="this.onerror=null;this.src='https://unpkg.com/aframe@1.4.2/dist/aframe.min.js'"></script>
<!-- AR.js (with CDN fallback) -->
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"
  onerror="this.onerror=null;this.src='https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js'"></script>

<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const loading = $('#loading');
const status = $('#status');
const debug = $('#debug');
const bottomBar = $('#bottom-bar');
const error = $('#error');
const video = $('#overlay-video');
const scene = $('#ar-scene');
const startBtn = $('#start-btn');
const spinner = $('#spinner');
const loadingHint = $('#loading-hint');

let playing = true;
let cameraStarted = false;

function setStatus(t, color){
  status.textContent = t;
  status.style.color = color || 'rgba(255,255,255,.5)';
  status.classList.remove('hidden');
}
function hideUI(){
  loading.classList.add('hidden');
  bottomBar.classList.remove('hidden');
  error.classList.remove('visible');
}
function showDebug(t){
  debug.textContent = t;
  debug.classList.remove('hidden');
}
function hideDebug(){
  debug.classList.add('hidden');
}
function showError(title, text){
  hideUI();
  $('#err-title').textContent = title;
  $('#err-text').textContent = text;
  error.classList.add('visible');
  console.error('[AR Tiger] ' + title + ': ' + text);
}

// Controls
$('#btn-pause').onclick = () => {
  if(playing){ video.pause(); playing=false; $('#btn-pause').innerHTML='\u25B6'; }
  else { video.play(); playing=true; $('#btn-pause').innerHTML='\u23F8'; }
};
$('#btn-fs').onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
$('#btn-watch').onclick = () => {
  error.classList.remove('visible');
  const v = document.createElement('video');
  v.src = 'assets/video.mp4'; v.controls = true; v.autoplay = true; v.playsInline = true;
  v.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;z-index:200';
  document.body.appendChild(v);
  v.onended = () => v.remove();
};

// Wait for libraries to be available (polling for reliability)
function waitForLibraries(){
  if(typeof AFRAME === 'undefined'){
    setTimeout(waitForLibraries, 200);
    return;
  }
  if(typeof AFRAME.components === 'undefined' || typeof AFRAME.components['hiro-marker'] === 'undefined'){
    setTimeout(waitForLibraries, 200);
    return;
  }
  // All libraries ready — show tap-to-start
  console.log('[AR Tiger] A-Frame', AFRAME.version, '| AR.js hiro-marker ready');
  showStartButton();
}
setTimeout(waitForLibraries, 50);

function showStartButton(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  
  loadingHint.innerHTML = 'Tap to start camera<br>then point at the artwork frame';
  startBtn.style.display = 'block';
  spinner.style.display = 'none';
  
  startBtn.onclick = startCamera;
}

function startCamera(){
  // Hide button, show spinner
  startBtn.style.display = 'none';
  spinner.style.display = 'block';
  loadingHint.innerHTML = 'Starting camera...<br>Please allow camera access';

  // Show loading screen
  loading.classList.remove('hidden');

  // Explicit getUserMedia — required for iOS Safari
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 960 }
      },
      audio: false
    }).then(function(stream){
      console.log('[AR Tiger] Camera stream acquired');
      cameraStarted = true;
      
      // Attach stream to the scene's video element
      const arVideo = document.querySelector('#arjs-video');
      if(arVideo){
        arVideo.srcObject = stream;
        arVideo.play().then(function(){
          console.log('[AR Tiger] Video playing');
          hideUI();
          setStatus('SCANNING FOR MARKER...');
          // Start marker detection
          startMarkerDetection();
        }).catch(function(err){
          console.error('[AR Tiger] Video play failed:', err);
          showError('Camera Error', 'Could not start video playback: ' + err.message);
        });
      } else {
        // No arjs-video yet — wait for scene to be ready
        hideUI();
        setStatus('SCANNING FOR MARKER...');
        startMarkerDetection();
      }
    }).catch(function(err){
      console.error('[AR Tiger] getUserMedia failed:', err);
      spinner.style.display = 'none';
      startBtn.style.display = 'block';
      loadingHint.innerHTML = 'Camera access denied.<br>Please allow camera and try again.';
      showError('Camera Access Needed', 
        'Please allow camera access to use AR. ' +
        'On iPhone, go to Safari settings and allow camera.');
    });
  } else {
    spinner.style.display = 'none';
    startBtn.style.display = 'block';
    loadingHint.innerHTML = 'Camera not supported.<br>Please use a modern browser.';
    showError('Camera Not Supported', 'Your browser does not support camera access. Please use a modern browser on your phone.');
  }
}

function startMarkerDetection(){
  // Start polling for marker detection
  let initAttempts = 0;
  function waitForCamera(){
    if(initAttempts++ > 90){
      showError('Camera Init Failed', 
        'Could not start the camera. Please allow camera access and try again.');
      return;
    }

    const arVideo = document.querySelector('#arjs-video');
    if(arVideo && arVideo.readyState >= 2){
      console.log('[AR Tiger] Camera ready (readyState:', arVideo.readyState + ')');
      hideUI();
      setStatus('SCANNING FOR MARKER...');
      hideDebug();
      return;
    }

    const videos = document.querySelectorAll('video');
    for(let v of videos){
      if(v.readyState >= 2 && v !== video){
        console.log('[AR Tiger] Camera ready on alternate video element');
        hideUI();
        setStatus('SCANNING FOR MARKER...');
        hideDebug();
        return;
      }
    }

    showDebug('Waiting for camera... (' + initAttempts + ')');
    setTimeout(waitForCamera, 500);
  }

  // AR.js events
  scene.addEventListener('markerFound', (e) => {
    if(e.detail.id === 'hiro' || e.detail.marker === 'hiro'){
      setStatus('VIDEO PLAYING', '#4ade80');
      hideDebug();
      console.log('[AR Tiger] Hiro marker found!');
    }
  });

  scene.addEventListener('markerLost', () => {
    setStatus('POINT AT MARKER');
    showDebug('Marker lost');
    setTimeout(hideDebug, 2000);
  });

  scene.addEventListener('cameraStarted', () => {
    console.log('[AR Tiger] cameraStarted event fired');
  });

  scene.addEventListener('loaded', () => {
    console.log('[AR Tiger] Scene loaded');
    showDebug('Scene loaded');
    setTimeout(waitForCamera, 1000);
  });

  scene.addEventListener('arjsError', (e) => {
    console.error('[AR Tiger] AR.js error:', e.detail);
    showError('AR Error', e.detail || 'An unknown AR.js error occurred.');
  });
}

function initAR(){
  if(typeof AFRAME === 'undefined') return;
  if(typeof AFRAME.components['hiro-marker'] === 'undefined'){
    console.warn('[AR Tiger] hiro-marker component not found');
  } else {
    console.log('[AR Tiger] hiro-marker component registered');
  }
}

})();
</script>
</body>
</html>
